name: Hostinger'a dagit

# Her push'ta derler ve Hostinger'a dagitir. Sirlar GitHub Secrets'tan gelir;
# depoda tutulmaz. Hiz icin 950 dosya tek tek degil, tek site.zip yuklenir ve
# sunucuda _deploy.php ile acilir. config.php (sirlar) zip'e KONMAZ; ayrica
# dogrudan api/'ye yuklenir (HTTP erisimi .htaccess ile kapali).

on:
  push:
    branches: [claude/adoring-gates-IQ4wM, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://nafuplanner.mftyazilim.com
      FTP_HOST: 145.14.156.26
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: PHP ve Composer kurulumu
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, gmp, bcmath, curl, openssl
          tools: composer

      - name: Paketi derle (arayuz + sunucu + public_html)
        run: bash deploy/build.sh

      - name: Paketi indirilebilir yap (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: nafuplanner-public_html
          path: deploy/output/nafuplanner-public_html.zip
          if-no-files-found: error

      - name: Sirlar tanimli mi
        id: guard
        run: |
          if [ -n "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FTP secret yok; yalnizca derleme + artifact yapildi."
          fi

      - name: config.php olustur (sirlardan, zip DISINA)
        if: steps.guard.outputs.ready == 'true'
        env:
          OUT: deploy/output/config.php
          DB_NAME: ${{ secrets.DB_USER }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: php deploy/make-config.php

      - name: Yukleme paketi hazirla (site.zip + _deploy.php)
        if: steps.guard.outputs.ready == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.CRON_SECRET }}
        run: |
          mkdir -p deploy/output/upload
          # site.zip: public_html ICERIGI (duz, kokte). config.php burada YOK.
          ( cd deploy/output/public_html && zip -rqX ../upload/site.zip . )
          # _deploy.php: anahtar gomulu cikartici
          sed "s|__DEPLOY_KEY__|${DEPLOY_KEY}|g" deploy/deploy-extract.php > deploy/output/upload/_deploy.php
          ls -la deploy/output/upload

      - name: FTP'ye yukle ve sunucuda cikart
        if: steps.guard.outputs.ready == 'true'
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          KEY: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          # Once FTPS (sifreli; Hostinger sertifikasi dogrulanamadigi icin -k),
          # olmazsa duz FTP. Hizli connect-timeout + backoff'lu yeniden deneme:
          # Hostinger gecici olarak baglantiyi dusurebiliyor (sik dagitim/fail2ban).
          ftp_put() {
            local src="$1" dst="$2" i
            for i in 1 2 3 4; do
              curl -fsS --connect-timeout 20 --max-time 150 --ssl-reqd -k --ftp-pasv --ftp-create-dirs \
                -T "$src" "ftp://${FTP_HOST}/${dst}" --user "${FTP_USER}:${FTP_PASS}" && return 0
              curl -fsS --connect-timeout 20 --max-time 150 --ftp-pasv --ftp-create-dirs \
                -T "$src" "ftp://${FTP_HOST}/${dst}" --user "${FTP_USER}:${FTP_PASS}" && return 0
              echo "FTP denemesi ${i}/4 basarisiz (${dst}); $((i * 15)) sn sonra tekrar..."
              sleep $((i * 15))
            done
            echo "::error::FTP yuklemesi basarisiz: ${dst} (sunucuya baglanilamadi)."
            return 1
          }
          echo "site.zip yukleniyor..."
          ftp_put deploy/output/upload/site.zip site.zip
          echo "_deploy.php yukleniyor..."
          ftp_put deploy/output/upload/_deploy.php _deploy.php
          echo "Sunucuda cikartiliyor (_deploy.php)..."
          sleep 3
          out=$(curl -s --connect-timeout 20 --max-time 120 -w "\nHTTP %{http_code}" "${APP_URL}/_deploy.php?key=${KEY}")
          echo "$out"
          echo "$out" | grep -q "HTTP 200" || { echo "::error::_deploy.php 200 donmedi. server kök/yol kontrolu gerekli."; exit 1; }
          echo "config.php api/'ye yukleniyor (zip disinda, gizli)..."
          ftp_put deploy/output/config.php api/config.php

      - name: Veritabani tablolarini kur (install.php)
        if: steps.guard.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.CRON_SECRET }}
        run: |
          sleep 2
          echo "install.php cagriliyor..."
          curl -s -w "\nHTTP %{http_code}\n" "${APP_URL}/api/install.php?key=${KEY}"

      - name: Saglik kontrolu
        if: steps.guard.outputs.ready == 'true'
        run: |
          echo "api/health:"
          curl -s -w "  HTTP %{http_code}\n" "${APP_URL}/api/health"; echo
          echo "api/config (google_client_id gorunmeli):"
          curl -s -w "  HTTP %{http_code}\n" "${APP_URL}/api/config"; echo
